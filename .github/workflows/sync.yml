name: sync

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia às 06:00 UTC (03:00 em Brasília)
  workflow_dispatch:
  push:
    paths: [sources.txt]  # sincroniza na hora quando você adiciona um repo

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar fontes
        id: sync
        continue-on-error: true
        run: bash scripts/sync.sh

      - name: Commit e push
        run: |
          git config user.name "sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A repos sources.lock
          if git diff --cached --quiet -- repos; then
            echo "Nenhuma fonte mudou."
            exit 0
          fi
          git commit -m "sync: $(date -u +%F)"
          git push

      - name: Falhar se alguma fonte não clonou
        if: steps.sync.outcome == 'failure'
        run: exit 1
